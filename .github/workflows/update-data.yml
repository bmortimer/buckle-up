name: Update Belt Data

on:
  schedule:
    # Run every morning at 11:30 UTC (3:30 AM PST / 4:30 AM PDT) to ensure previous night's scores are posted
    - cron: '30 11 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute schedule flags
        id: when
        run: |
          # Each league step decides whether to run based on:
          #   (a) it is in its regular season this month, OR
          #   (b) today is the 1st or 15th (monthly catch-up for error correction)
          DAY=$(date +%-d)
          MONTH=$(date +%-m)
          CATCHUP=false
          if [ "$DAY" -eq 1 ] || [ "$DAY" -eq 15 ]; then
            CATCHUP=true
          fi
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "catchup=$CATCHUP" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update NBA data
        env:
          MONTH: ${{ steps.when.outputs.month }}
          CATCHUP: ${{ steps.when.outputs.catchup }}
        run: |
          # NBA regular season: Oct-Apr
          IN_SEASON=false
          if [ "$MONTH" -ge 10 ] || [ "$MONTH" -le 4 ]; then IN_SEASON=true; fi
          if [ "$IN_SEASON" = "false" ] && [ "$CATCHUP" = "false" ]; then
            echo "NBA: out of season and not a catch-up day - skipping"
            exit 0
          fi
          echo "NBA: running update (in_season=$IN_SEASON catchup=$CATCHUP)"
          if ! python scripts/update_nba.py; then
            echo "⚠️  NBA update failed - please check logs"
            exit 1
          fi

      - name: Update NHL data
        env:
          MONTH: ${{ steps.when.outputs.month }}
          CATCHUP: ${{ steps.when.outputs.catchup }}
        run: |
          # NHL regular season: Oct-Apr
          IN_SEASON=false
          if [ "$MONTH" -ge 10 ] || [ "$MONTH" -le 4 ]; then IN_SEASON=true; fi
          if [ "$IN_SEASON" = "false" ] && [ "$CATCHUP" = "false" ]; then
            echo "NHL: out of season and not a catch-up day - skipping"
            exit 0
          fi
          echo "NHL: running update (in_season=$IN_SEASON catchup=$CATCHUP)"
          # Add delay before NHL fetch to be respectful to hockey-reference.com
          sleep 10
          if ! python scripts/update_nhl.py; then
            echo "⚠️  NHL update failed - please check logs"
            exit 1
          fi

      - name: Update WNBA data
        env:
          MONTH: ${{ steps.when.outputs.month }}
          CATCHUP: ${{ steps.when.outputs.catchup }}
        run: |
          # WNBA regular season: May-Oct
          IN_SEASON=false
          if [ "$MONTH" -ge 5 ] && [ "$MONTH" -le 10 ]; then IN_SEASON=true; fi
          if [ "$IN_SEASON" = "false" ] && [ "$CATCHUP" = "false" ]; then
            echo "WNBA: out of season and not a catch-up day - skipping"
            exit 0
          fi
          echo "WNBA: running update (in_season=$IN_SEASON catchup=$CATCHUP)"
          if ! python scripts/update_wnba.py; then
            echo "⚠️  WNBA update failed - please check logs"
            exit 1
          fi

      - name: Update PWHL data
        env:
          MONTH: ${{ steps.when.outputs.month }}
          CATCHUP: ${{ steps.when.outputs.catchup }}
        run: |
          # PWHL regular season: Nov-Apr
          IN_SEASON=false
          if [ "$MONTH" -ge 11 ] || [ "$MONTH" -le 4 ]; then IN_SEASON=true; fi
          if [ "$IN_SEASON" = "false" ] && [ "$CATCHUP" = "false" ]; then
            echo "PWHL: out of season and not a catch-up day - skipping"
            exit 0
          fi
          echo "PWHL: running update (in_season=$IN_SEASON catchup=$CATCHUP)"
          sleep 10
          if ! python scripts/update_pwhl.py; then
            echo "⚠️  PWHL update failed - please check logs"
            # Don't exit 1 - allow workflow to continue
            echo "Continuing..."
          fi

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/ web/public/sitemap.xml || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ web/public/sitemap.xml
          git commit -m "Update belt data - $(date '+%Y-%m-%d')"
          git push
